version: v2
plugins:
    - local: [go, tool, protoc-gen-go]
      out: gen
      opt: paths=source_relative
    - local: [go, tool, protoc-gen-connect-go]
      out: gen
      opt:
          - paths=source_relative
          - simple

    # Generates standard Protobuf messages (_pb.ts)
    - local: protoc-gen-es
      out: web/app/web-client/src/lib/client
      opt: target=ts
    # Generates Connect RPC clients (_connect.ts)
    - local: protoc-gen-connect-es
      out: web/app/web-client/src/lib/client
      opt: target=ts

managed:
    enabled: true
    override:
        - file_option: go_package_prefix
          value: github.com/z0l1/connectrpc-demo/gen
    disable:
        - file_option: go_package
          module: buf.build/bufbuild/protovalidate
